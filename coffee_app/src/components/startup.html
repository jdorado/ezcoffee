<style>
  .startup-splash, .startup-splash * { box-sizing: border-box; }
  .startup-splash { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: #f8f8f5; color: #20211f; font-family: system-ui, -apple-system, sans-serif; }
  .startup-splash .logbook-loading { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 32px; }
  .startup-splash .loading-logo { display: block; width: 220px; height: 48px; object-fit: contain; margin-bottom: 22px; }
  .startup-splash p { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: #454640; font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
  .startup-splash .loading-caption { font-size: 12px; color: #696b62; }
  .startup-splash .loading-emblem { position: relative; display: grid; place-items: center; width: 112px; height: 112px; margin-bottom: 28px; }
  .startup-splash .loading-orbit { position: absolute; inset: 0; border: 2px solid #dedfd7; border-top: 4px solid #f2cb45; border-right-color: transparent; border-radius: 50%; animation: coffee-orbit 3s linear infinite; }
  .startup-splash .loading-cup { position: relative; width: 38px; height: 32px; border: 2px solid #20211f; border-radius: 3px 3px 14px 14px; margin-top: 12px; }
  .startup-splash .loading-cup::after { content: ''; position: absolute; top: 4px; right: -12px; width: 10px; height: 15px; border: 2px solid #20211f; border-left: 0; border-radius: 0 8px 8px 0; }
  .startup-splash .loading-cup i { position: absolute; inset: 5px 3px 3px; background: #f2cb45; border-radius: 1px 1px 9px 9px; transform-origin: bottom; animation: coffee-fill 2.4s ease-in-out infinite; }
  .startup-splash .loading-drop { position: absolute; top: 25px; width: 5px; height: 8px; background: #20211f; border-radius: 50%; animation: coffee-drop 2.4s ease-in infinite; }
  .startup-splash .loading-dots { display: inline-flex; gap: 3px; }
  .startup-splash .loading-dots i { width: 3px; height: 3px; background: #20211f; border-radius: 50%; animation: coffee-breathe 1s ease-in-out infinite alternate; }
  .startup-splash .loading-dots i:nth-child(2) { animation-delay: .2s; }
  .startup-splash .loading-dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes coffee-orbit { to { transform: rotate(360deg); } }
  @keyframes coffee-fill { 0%, 100% { transform: scaleY(.3); } 65%, 85% { transform: scaleY(1); } }
  @keyframes coffee-drop { 0%, 65%, 100% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 55% { opacity: 0; transform: translateY(30px); } }
  @keyframes coffee-breathe { from { opacity: .35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .startup-splash *, .startup-splash *::after { animation: none !important; }
  }
</style>
<div class="startup-splash" role="status" aria-label="Opening your logbook" aria-busy="true">
  <div class="logbook-loading">
    <div class="loading-emblem" aria-hidden="true"><span class="loading-orbit"></span><span class="loading-cup"><i></i></span><span class="loading-drop"></span></div>
    <img class="loading-logo" src="/ezcoffee-logo-header.png" alt="ezcoffee" width="220" height="48">
    <p>Getting your bar ready<span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
    <span class="loading-caption">A moment before a good coffee.</span>
  </div>
</div>
