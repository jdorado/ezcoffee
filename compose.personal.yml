name: ezcoffee-personal
services:
  api:
    build:
      context: .
      dockerfile: coffee_api/Dockerfile
    env_file: ${COFFEE_ENV_FILE:?Set COFFEE_ENV_FILE to the private runtime environment file}
    environment:
      APP_MODE: personal
      COFFEE_AI_ENABLED: "true"
      COFFEE_REQUIRE_AUTH: "true"
      MONGO_DB: ${MONGO_DB:-ezcoffee}
    ports:
      - "127.0.0.1:${COFFEE_API_PORT:-18084}:8080"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
