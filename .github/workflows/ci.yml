name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coffee_app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coffee_api/requirements.txt
      - name: Install dependencies
        run: |
          npm --prefix coffee_app ci
          python -m venv coffee_api/.venv
          coffee_api/.venv/bin/pip install -r coffee_api/requirements.txt
      - name: Test
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Validate containers
        run: |
          docker compose -f compose.yml -f compose.local.yml config
          docker compose -f compose.yml build
          EZCOFFEE_RUNTIME_ENV=/dev/null docker compose -f compose.hosted.yml build
      - name: Audit production dependencies
        run: |
          npm --prefix coffee_app audit --omit=dev --omit=optional
          python -m pip install pip-audit
          python -m pip_audit -r coffee_api/requirements.txt

  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EZCOFFEE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EZCOFFEE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ezcoffee"
          chmod 600 "$HOME/.ssh/ezcoffee"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ secrets.EZCOFFEE_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.EZCOFFEE_SSH_USER }}
          REVISION: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/ezcoffee" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-ezcoffee '$REVISION'"
      - name: Verify API
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 https://api.ezcoffee.space/health
